<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FreshPlan - Local Recipe Bank</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const STORES = [
      { id: 'smart_split', name: 'Smart Split (Best Value Across All 3)', icon: 'fa-layer-group', desc: 'Routes bulk to Costco, produce to Vos, staples to Walmart' },
      { id: 'vos', name: "Vos' YIG (Port Perry)", icon: 'fa-basket-shopping', desc: 'Local produce, fresh meat, specialty deli & bakery' },
      { id: 'walmart', name: 'Walmart Supercentre (North Oshawa)', icon: 'fa-cart-shopping', desc: 'Pantry staples, frozen goods, household items' },
      { id: 'costco', name: 'Costco Wholesale (North Oshawa)', icon: 'fa-box', desc: 'Bulk proteins, produce packs, dairy & snacks' }
    ];

    // Embedded Recipe Bank (No external files needed - zero 404 risk)
    const RECIPE_BANK = [
      {
        id: 1,
        title: "Pan-Seared Salmon with Asparagus & Quinoa",
        category: "Seafood Special",
        estCostPerMeal: 21.50,
        servings: 4,
        saleBadge: "Atlantic Salmon Deal at Vos' YIG",
        image: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Atlantic Salmon Fillets", qty: 4, unit: "pieces", price: 12.99, category: "Meat & Seafood", store: "vos", isPantry: false },
          { name: "Fresh Asparagus", qty: 1, unit: "bunch", price: 3.49, category: "Produce", store: "vos", isPantry: false },
          { name: "Quinoa", qty: 1, unit: "bag", price: 2.50, category: "Pantry", store: "costco", isPantry: false },
          { name: "Olive Oil", qty: 2, unit: "tbsp", price: 0.40, category: "Pantry", store: "costco", isPantry: true }
        ]
      },
      {
        id: 2,
        title: "Sheet Pan Chicken Fajitas",
        category: "Family Favorites",
        estCostPerMeal: 17.50,
        servings: 4,
        saleBadge: "Bulk Peppers & Chicken at Costco",
        image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Chicken Breasts (Bulk)", qty: 1, unit: "kg", price: 10.99, category: "Meat & Seafood", store: "costco", isPantry: false },
          { name: "Bell Peppers (3 Pack)", qty: 1, unit: "pack", price: 3.99, category: "Produce", store: "costco", isPantry: false },
          { name: "Flour Tortillas", qty: 1, unit: "pack", price: 2.50, category: "Bakery", store: "walmart", isPantry: false }
        ]
      },
      {
        id: 3,
        title: "Garlic Butter Steak Bites & Broccoli",
        category: "High Protein",
        estCostPerMeal: 19.50,
        servings: 4,
        saleBadge: "Striploin Steak Deal at Costco",
        image: "https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Beef Striploin Cuts", qty: 2, unit: "packs", price: 13.99, category: "Meat & Seafood", store: "costco", isPantry: false },
          { name: "Fresh Broccoli Crowns", qty: 2, unit: "heads", price: 3.50, category: "Produce", store: "vos", isPantry: false }
        ]
      },
      {
        id: 4,
        title: "Lemon Herb Roasted Chicken Thighs",
        category: "Quick & Easy",
        estCostPerMeal: 14.00,
        servings: 4,
        saleBadge: "Chicken Thigh Value Pack at Vos' YIG",
        image: "https://images.unsplash.com/photo-1598515214211-89d3c73ae83b?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Bone-In Chicken Thighs", qty: 1, unit: "tray", price: 9.50, category: "Meat & Seafood", store: "vos", isPantry: false },
          { name: "Baby Potatoes", qty: 1, unit: "bag", price: 3.50, category: "Produce", store: "costco", isPantry: false }
        ]
      },
      {
        id: 5,
        title: "Shrimp & Pesto Linguine Pasta",
        category: "Quick & Easy",
        estCostPerMeal: 18.00,
        servings: 4,
        saleBadge: "Jumbo Shrimp Bulk Special at Costco",
        image: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Frozen Jumbo Shrimp", qty: 1, unit: "bag", price: 11.99, category: "Meat & Seafood", store: "costco", isPantry: false },
          { name: "Basil Pesto Sauce", qty: 1, unit: "jar", price: 4.50, category: "Pantry", store: "vos", isPantry: false },
          { name: "Linguine Pasta", qty: 1, unit: "box", price: 1.99, category: "Pantry", store: "walmart", isPantry: false }
        ]
      }
    ];

    function App() {
      const [step, setStep] = useState(1);
      const [weeklyBudget, setWeeklyBudget] = useState(175);
      const [mealsPerWeek, setMealsPerWeek] = useState(4);
      const [servingsPerMeal, setServingsPerMeal] = useState(4);
      const [primaryStore, setPrimaryStore] = useState('smart_split');

      const [displayedRecipes, setDisplayedRecipes] = useState(RECIPE_BANK.slice(0, 3));
      const [selectedRecipes, setSelectedRecipes] = useState([1, 2]);

      const [ownedPantryItems, setOwnedPantryItems] = useState({ 'Olive Oil': true });
      const [checkedCartItems, setCheckedCartItems] = useState({});

      // Shuffle recipes instantly from internal bank
      const shuffleRecipes = () => {
        const shuffled = [...RECIPE_BANK].sort(() => 0.5 - Math.random());
        const newBatch = shuffled.slice(0, 3);
        setDisplayedRecipes(newBatch);
        setSelectedRecipes(newBatch.map(r => r.id));
      };

      const toggleRecipe = (id) => {
        setSelectedRecipes(prev => prev.includes(id) ? prev.filter(rId => rId !== id) : [...prev, id]);
      };

      const totalEstimatedCost = useMemo(() => {
        return selectedRecipes.reduce((sum, id) => {
          const r = RECIPE_BANK.find(item => item.id === id);
          return sum + (r ? r.estCostPerMeal : 0);
        }, 0);
      }, [selectedRecipes]);

      const aggregatedList = useMemo(() => {
        const items = {};
        selectedRecipes.forEach(rId => {
          const recipe = RECIPE_BANK.find(item => item.id === rId);
          if (!recipe) return;
          recipe.ingredients.forEach(ing => {
            if (primaryStore !== 'smart_split' && ing.store !== primaryStore) return;
            if (ing.isPantry && ownedPantryItems[ing.name]) return;
            const key = `${ing.name}-${ing.unit}`;
            if (items[key]) {
              items[key].qty += ing.qty;
              items[key].price += ing.price;
            } else {
              items[key] = { ...ing, key };
            }
          });
        });
        return Object.values(items);
      }, [selectedRecipes, primaryStore, ownedPantryItems]);

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen shadow-2xl flex flex-col">
          <header className="bg-emerald-800 text-white p-4 sticky top-0 z-20 shadow-md">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="text-xl font-black tracking-wide"><i className="fa-solid fa-utensils text-emerald-400 mr-2"></i>FreshPlan</h1>
                <p className="text-[11px] text-emerald-200">Port Perry & North Oshawa</p>
              </div>
              <span className="text-xs bg-emerald-900 border border-emerald-600 px-2.5 py-1 rounded-full font-bold">
                Step {step} of 4
              </span>
            </div>
            {step > 1 && (
              <div className="mt-3 pt-3 border-t border-emerald-700">
                <div className="flex justify-between text-xs font-semibold mb-1">
                  <span>Est. Total: ${totalEstimatedCost.toFixed(2)}</span>
                  <span>Budget: ${weeklyBudget}</span>
                </div>
                <div className="w-full bg-emerald-950 rounded-full h-2.5 overflow-hidden">
                  <div className="bg-emerald-400 h-2.5" style={{ width: `${Math.min(100, (totalEstimatedCost / weeklyBudget) * 100)}%` }}></div>
                </div>
              </div>
            )}
          </header>

          {step === 1 && (
            <main className="p-5 flex-1 space-y-6">
              <h2 className="text-lg font-bold text-gray-900 border-b pb-2">Step 1: Setup & Stores</h2>
              <div className="space-y-2">
                <div className="flex justify-between items-center text-sm font-bold">
                  <span>Weekly Budget:</span>
                  <span className="text-emerald-700 text-lg">${weeklyBudget}</span>
                </div>
                <input type="range" min="75" max="400" step="25" value={weeklyBudget} onChange={(e) => setWeeklyBudget(Number(e.target.value))} className="w-full accent-emerald-600" />
              </div>
              <div className="space-y-2">
                <label className="text-sm font-bold text-gray-800 block">Select Store Routing:</label>
                {STORES.map(store => (
                  <div key={store.id} onClick={() => setPrimaryStore(store.id)} className={`p-3 rounded-xl border cursor-pointer flex items-center space-x-3 ${primaryStore === store.id ? 'border-emerald-600 bg-emerald-50' : 'border-gray-200'}`}>
                    <i className={`fa-solid ${store.icon} text-emerald-700`}></i>
                    <div>
                      <p className="text-xs font-bold text-gray-900">{store.name}</p>
                      <p className="text-[10px] text-gray-500">{store.desc}</p>
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={() => setStep(2)} className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-lg">Continue to Meal Selection</button>
            </main>
          )}

          {step === 2 && (
            <main className="p-4 flex-1 space-y-4">
              <div className="flex justify-between items-center border-b pb-3">
                <div>
                  <h2 className="text-base font-bold text-gray-900">Step 2: Meal Selection</h2>
                  <p className="text-xs text-gray-500">Built-in Durham Region Recipe Bank</p>
                </div>
                <button onClick={shuffleRecipes} className="text-xs font-bold bg-amber-50 text-amber-700 border border-amber-300 px-3 py-1.5 rounded-lg flex items-center space-x-1 shadow-sm">
                  <i className="fa-solid fa-shuffle"></i>
                  <span>Shuffle Ideas</span>
                </button>
              </div>

              <div className="space-y-3">
                {displayedRecipes.map(recipe => {
                  const isSelected = selectedRecipes.includes(recipe.id);
                  return (
                    <div key={recipe.id} className={`border rounded-xl p-3 flex space-x-3 ${isSelected ? 'border-emerald-600 bg-emerald-50/20 shadow' : 'border-gray-200'}`}>
                      <img src={recipe.image} className="w-20 h-20 object-cover rounded-lg" />
                      <div className="flex-1">
                        <span className="text-[9px] font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded">{recipe.category}</span>
                        <h3 className="font-bold text-xs mt-1">{recipe.title}</h3>
                        <p className="text-[10px] text-amber-700 font-semibold mt-1"><i className="fa-solid fa-tag mr-1"></i>{recipe.saleBadge}</p>
                        <button onClick={() => toggleRecipe(recipe.id)} className={`mt-2 w-full py-1 text-xs font-bold rounded-lg ${isSelected ? 'bg-emerald-700 text-white' : 'bg-gray-200 text-gray-700'}`}>
                          {isSelected ? '✓ Selected' : '+ Select Meal'}
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>

              <button onClick={() => setStep(3)} className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl">Continue to Pantry Check</button>
            </main>
          )}

          {step === 3 && (
            <main className="p-4 flex-1 space-y-4">
              <h2 className="text-base font-bold text-gray-900 border-b pb-2">Step 3: Pantry Check</h2>
              <div onClick={() => setOwnedPantryItems(prev => ({ ...prev, 'Olive Oil': !prev['Olive Oil'] }))} className={`p-3 rounded-xl border flex justify-between items-center cursor-pointer ${ownedPantryItems['Olive Oil'] ? 'bg-emerald-50 border-emerald-300' : 'bg-white'}`}>
                <span className="text-xs font-bold">Olive Oil</span>
                <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-200 text-emerald-900">{ownedPantryItems['Olive Oil'] ? 'Have at Home' : 'Need to Buy'}</span>
              </div>
              <button onClick={() => setStep(4)} className="w-full bg-emerald-700 text-white font-bold py-3.5 rounded-xl">Build Grocery List</button>
            </main>
          )}

          {step === 4 && (
            <main className="p-4 flex-1 space-y-4">
              <h2 className="text-base font-bold text-gray-900 border-b pb-2">Step 4: Grocery List</h2>
              <div className="space-y-2">
                {aggregatedList.map(item => (
                  <div key={item.key} onClick={() => setCheckedCartItems(prev => ({ ...prev, [item.key]: !prev[item.key] }))} className={`p-3 rounded-xl border flex justify-between items-center cursor-pointer ${checkedCartItems[item.key] ? 'opacity-40 bg-gray-100' : 'bg-white'}`}>
                    <div>
                      <p className="text-xs font-bold">{item.name}</p>
                      <p className="text-[10px] text-gray-500">{item.store.toUpperCase()}</p>
                    </div>
                    <span className="text-xs font-black text-emerald-700">${item.price.toFixed(2)}</span>
                  </div>
                ))}
              </div>
              <button onClick={() => setStep(1)} className="w-full bg-gray-100 text-gray-700 font-bold py-2.5 rounded-xl text-xs">Start New Plan</button>
            </main>
          )}
        </div>
      );
    }
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
