<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FreshPlan - Meal Planning & Grocery App</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const STORES = [
      { id: 'all', name: 'All Stores (Split Shopping List)', icon: 'fa-store', badge: 'Smart Split' },
      { id: 'vos', name: "Vos' YIG (Port Perry)", icon: 'fa-basket-shopping', color: 'bg-red-600', fulfill: 'PC Express Pickup' },
      { id: 'walmart', name: 'Walmart (North Oshawa)', icon: 'fa-cart-shopping', color: 'bg-blue-600', fulfill: 'Walmart Pickup / Delivery' },
      { id: 'costco', name: 'Costco (North Oshawa)', icon: 'fa-box', color: 'bg-amber-600', fulfill: 'Costco / Instacart' }
    ];

    const RECIPES = [
      {
        id: 1,
        title: "Grilled Salmon & Asparagus",
        category: "Healthy & Quick",
        prepTime: "20 mins",
        servings: 4,
        image: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Salmon Fillets", qty: 4, unit: "pieces", category: "Meat & Seafood", store: "costco" },
          { name: "Fresh Asparagus", qty: 1, unit: "bunch", category: "Produce", store: "vos" },
          { name: "Olive Oil", qty: 2, unit: "tbsp", category: "Pantry", store: "costco" },
          { name: "Lemon", qty: 2, unit: "items", category: "Produce", store: "vos" },
          { name: "Garlic Powder", qty: 1, unit: "tsp", category: "Pantry", store: "walmart" }
        ]
      },
      {
        id: 2,
        title: "Sheet Pan Chicken Fajitas",
        category: "Family Favorites",
        prepTime: "25 mins",
        servings: 4,
        image: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Chicken Breasts", qty: 3, unit: "large", category: "Meat & Seafood", store: "costco" },
          { name: "Bell Peppers (3 Pack)", qty: 1, unit: "pack", category: "Produce", store: "costco" },
          { name: "Yellow Onion", qty: 2, unit: "items", category: "Produce", store: "vos" },
          { name: "Tortillas (Flour)", qty: 1, unit: "pack", category: "Bakery", store: "walmart" },
          { name: "Fajita Seasoning", qty: 1, unit: "packet", category: "Pantry", store: "walmart" },
          { name: "Salsa", qty: 1, unit: "jar", category: "Pantry", store: "walmart" }
        ]
      },
      {
        id: 3,
        title: "Greek Avocado Salad",
        category: "Low Carb",
        prepTime: "15 mins",
        servings: 2,
        image: "https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80",
        ingredients: [
          { name: "Avocados", qty: 3, unit: "items", category: "Produce", store: "costco" },
          { name: "English Cucumber", qty: 1, unit: "item", category: "Produce", store: "vos" },
          { name: "Cherry Tomatoes", qty: 1, unit: "pint", category: "Produce", store: "vos" },
          { name: "Feta Cheese", qty: 200, unit: "g", category: "Dairy", store: "costco" },
          { name: "Kalamata Olives", qty: 1, unit: "jar", category: "Pantry", store: "walmart" }
        ]
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('menu');
      const [selectedStore, setSelectedStore] = useState('all');
      const [selectedRecipes, setSelectedRecipes] = useState([1, 2]);
      const [servingsMap, setServingsMap] = useState({ 1: 4, 2: 4, 3: 2 });
      const [checkedItems, setCheckedItems] = useState({});

      const toggleRecipe = (id) => {
        setSelectedRecipes(prev => 
          prev.includes(id) ? prev.filter(rId => rId !== id) : [...prev, id]
        );
      };

      const updateServings = (id, delta) => {
        setServingsMap(prev => ({
          ...prev,
          [id]: Math.max(1, (prev[id] || 4) + delta)
        }));
      };

      const aggregatedList = useMemo(() => {
        const items = {};
        selectedRecipes.forEach(rId => {
          const recipe = RECIPES.find(r => r.id === rId);
          if (!recipe) return;
          const baseServings = recipe.servings;
          const currentServings = servingsMap[rId] || baseServings;
          const ratio = currentServings / baseServings;

          recipe.ingredients.forEach(ing => {
            if (selectedStore !== 'all' && ing.store !== selectedStore) return;

            const key = `${ing.name}-${ing.unit}`;
            const adjustedQty = Math.round((ing.qty * ratio) * 10) / 10;

            if (items[key]) {
              items[key].qty += adjustedQty;
            } else {
              items[key] = {
                ...ing,
                qty: adjustedQty,
                key
              };
            }
          });
        });
        return Object.values(items);
      }, [selectedRecipes, servingsMap, selectedStore]);

      const toggleCheck = (key) => {
        setCheckedItems(prev => ({ ...prev, [key]: !prev[key] }));
      };

      return (
        <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
          {/* Header */}
          <header className="bg-emerald-700 text-white p-4 sticky top-0 z-20 shadow-md">
            <div className="flex justify-between items-center mb-2">
              <h1 className="text-xl font-bold tracking-tight"><i className="fa-solid fa-utensils mr-2"></i>FreshPlan</h1>
              <span className="text-xs bg-emerald-800 text-emerald-100 px-2.5 py-1 rounded-full font-medium">
                {selectedRecipes.length} Meals Chosen
              </span>
            </div>
            
            {/* Store Selector */}
            <div className="mt-2">
              <label className="text-xs text-emerald-100 font-medium block mb-1">Target Shopping Location:</label>
              <select 
                value={selectedStore} 
                onChange={(e) => setSelectedStore(e.target.value)}
                className="w-full bg-emerald-800 text-white text-sm font-semibold rounded-lg px-3 py-2 border border-emerald-600 focus:outline-none focus:ring-2 focus:ring-white"
              >
                {STORES.map(store => (
                  <option key={store.id} value={store.id}>
                    {store.name}
                  </option>
                ))}
              </select>
            </div>
          </header>

          {/* Navigation Tabs */}
          <div className="flex border-b border-gray-200 bg-white sticky top-[105px] z-10">
            <button 
              onClick={() => setActiveTab('menu')}
              className={`flex-1 py-3 text-center text-sm font-semibold border-b-2 transition-colors ${activeTab === 'menu' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-gray-500'}`}
            >
              <i className="fa-solid fa-book-open mr-2"></i>Weekly Menu
            </button>
            <button 
              onClick={() => setActiveTab('cart')}
              className={`flex-1 py-3 text-center text-sm font-semibold border-b-2 transition-colors relative ${activeTab === 'cart' ? 'border-emerald-600 text-emerald-700' : 'border-transparent text-gray-500'}`}
            >
              <i className="fa-solid fa-cart-shopping mr-2"></i>Grocery List
              {aggregatedList.length > 0 && (
                <span className="ml-2 bg-emerald-600 text-white text-xs px-2 py-0.5 rounded-full">
                  {aggregatedList.length}
                </span>
              )}
            </button>
          </div>

          {/* Body Content */}
          <main className="p-4 flex-1">
            {activeTab === 'menu' ? (
              <div className="space-y-4">
                <p className="text-xs text-gray-500 font-medium">Select meals to build your automatically organized grocery store list.</p>
                {RECIPES.map(recipe => {
                  const isSelected = selectedRecipes.includes(recipe.id);
                  const servings = servingsMap[recipe.id] || recipe.servings;

                  return (
                    <div 
                      key={recipe.id}
                      className={`border rounded-xl overflow-hidden shadow-sm transition-all ${isSelected ? 'border-emerald-500 ring-2 ring-emerald-500/20 bg-emerald-50/10' : 'border-gray-200 bg-white'}`}
                    >
                      <img src={recipe.image} alt={recipe.title} className="w-full h-36 object-cover" />
                      <div className="p-3">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[10px] font-bold uppercase tracking-wider text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded">
                              {recipe.category}
                            </span>
                            <h3 className="font-bold text-gray-900 mt-1">{recipe.title}</h3>
                          </div>
                          <button
                            onClick={() => toggleRecipe(recipe.id)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isSelected ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'}`}
                          >
                            {isSelected ? <><i className="fa-solid fa-check mr-1"></i>Selected</> : '+ Add Meal'}
                          </button>
                        </div>

                        {/* Serving Adjuster */}
                        {isSelected && (
                          <div className="mt-3 pt-3 border-t border-gray-100 flex justify-between items-center bg-gray-50 p-2 rounded-lg">
                            <span className="text-xs font-semibold text-gray-600">Servings:</span>
                            <div className="flex items-center space-x-2">
                              <button 
                                onClick={() => updateServings(recipe.id, -1)}
                                className="w-7 h-7 rounded-md bg-white border border-gray-300 text-gray-700 font-bold flex items-center justify-center text-sm shadow-sm active:bg-gray-100"
                              >-</button>
                              <span className="text-sm font-bold text-gray-800 min-w-[20px] text-center">{servings}</span>
                              <button 
                                onClick={() => updateServings(recipe.id, 1)}
                                className="w-7 h-7 rounded-md bg-white border border-gray-300 text-gray-700 font-bold flex items-center justify-center text-sm shadow-sm active:bg-gray-100"
                              >+</button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            ) : (
              <div className="space-y-4">
                <div className="bg-emerald-50 p-3 rounded-lg border border-emerald-200 flex justify-between items-center">
                  <div>
                    <span className="text-xs font-bold text-emerald-800 block">Filtered for:</span>
                    <span className="text-xs text-emerald-900 font-medium">
                      {STORES.find(s => s.id === selectedStore)?.name}
                    </span>
                  </div>
                  <i className="fa-solid fa-store text-emerald-600 text-lg"></i>
                </div>

                {aggregatedList.length === 0 ? (
                  <div className="text-center py-12 text-gray-400">
                    <i className="fa-solid fa-basket-shopping text-4xl mb-2"></i>
                    <p className="text-sm font-medium">No items found for this store selection.</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    {aggregatedList.map(item => {
                      const isChecked = !!checkedItems[item.key];
                      const itemStore = STORES.find(s => s.id === item.store);

                      return (
                        <div 
                          key={item.key}
                          onClick={() => toggleCheck(item.key)}
                          className={`p-3 rounded-lg border flex items-center justify-between cursor-pointer transition-all ${isChecked ? 'bg-gray-50 border-gray-200 opacity-60' : 'bg-white border-gray-200 shadow-sm'}`}
                        >
                          <div className="flex items-center space-x-3">
                            <input 
                              type="checkbox" 
                              checked={isChecked} 
                              onChange={() => {}}
                              className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                            />
                            <div>
                              <p className={`text-sm font-semibold ${isChecked ? 'line-through text-gray-500' : 'text-gray-800'}`}>
                                {item.name}
                              </p>
                              <div className="flex items-center space-x-2 mt-0.5">
                                <span className="text-[10px] text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded font-medium">
                                  {item.category}
                                </span>
                                {selectedStore === 'all' && (
                                  <span className={`text-[10px] text-white px-1.5 py-0.5 rounded font-medium ${itemStore?.color || 'bg-gray-600'}`}>
                                    {itemStore?.name.split(' ')[0]}
                                  </span>
                                )}
                              </div>
                            </div>
                          </div>
                          <span className="text-sm font-bold text-emerald-700 bg-emerald-50 px-2 py-1 rounded">
                            {item.qty} {item.unit}
                          </span>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
